services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: domtekdb
      MYSQL_USER: domtek_user
      MYSQL_PASSWORD: domtek_user???
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [domtek]

  backend:
    build:
      context: ./Domtek
    image: domtek-backend:latest
    restart: unless-stopped
    env_file: ./Domtek/.env
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
    networks: [domtek]

  scheduler:
    build:
      context: ./Domtek
    image: domtek-backend:latest
    restart: unless-stopped
    env_file: ./Domtek/.env
    volumes:
      - storage_data:/var/www/html/storage/app/public
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on: [backend]
    networks: [domtek]

  frontend:
    build:
      context: ./domtek-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    networks: [domtek]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [domtek]

networks:
  domtek:
    driver: bridge

volumes:
  mysql_data:
  storage_data:
